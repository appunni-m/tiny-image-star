<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>Untitled design — Tiny Image Star</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23744bff'/%3E%3Cpath d='M32 9 37 26 55 32 37 38 32 55 27 38 9 32 27 26z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="topbar">
        <div class="brand-area">
          <button class="brand-button" id="main-menu-button" aria-label="Open main menu" title="Main menu">✦</button>
          <div class="file-menu-wrap">
            <button class="file-menu-button" id="file-menu-button" aria-expanded="false">File <span>⌄</span></button>
            <div class="file-menu" id="file-menu" hidden>
              <button data-action="new-file">New design <kbd>⌘ N</kbd></button>
              <button data-action="open-project">Open local project…</button>
              <button data-action="save-file">Save project file… <kbd>⌘ S</kbd></button>
              <button data-action="export-file">Export frame <kbd>⇧ ⌘ E</kbd></button>
              <hr />
              <button data-action="open-image">Place image…</button>
            </div>
          </div>
        </div>
        <div class="doc-title-wrap">
          <input id="doc-title" class="doc-title" aria-label="Design file name" value="Northstar — Weekend escapes" maxlength="80" />
          <span id="save-indicator" class="save-indicator"><i></i> Saved locally</span>
        </div>
        <div class="top-actions">
          <button class="icon-button search-button" id="search-button" aria-label="Search layers and tools" title="Quick actions · ⌘ K">⌕</button>
          <div class="avatar-stack" aria-label="Local workspace"><span class="avatar">Y</span></div>
          <button class="top-button invite-button" disabled title="This local-first edition has no online collaboration yet">Invite</button>
          <button class="top-button present-button" id="present-button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z"/></svg><span>Present</span></button>
          <button class="top-button export-button" id="export-button">Export <span>⌄</span></button>
        </div>
      </header>

      <div class="workspace">
        <aside class="left-panel" aria-label="Pages and layers">
          <div class="left-tabs"><button class="left-tab active">Layers</button><button class="left-tab" id="assets-tab">Assets</button></div>
          <section class="pages-section">
            <div class="section-title"><span>Pages</span><button class="tiny-icon" id="add-page" aria-label="Add page" title="Add page">＋</button></div>
            <div class="page-list" id="page-list" aria-label="Design pages"></div>
          </section>
          <section class="layers-section">
            <div class="section-title"><span>Layers</span><div class="section-actions"><button class="tiny-icon" id="layer-search" title="Find in layers" aria-label="Find in layers">⌕</button><button class="tiny-icon" id="layer-more" title="Layer options" aria-label="Layer options">···</button></div></div>
            <label class="layer-search-box" id="layer-search-box" hidden><span>⌕</span><input id="layer-filter" placeholder="Find layers" /></label>
            <div class="layer-tree" id="layer-tree" role="tree" aria-label="Layers"></div>
          </section>
          <div class="left-footer"><span class="device-dot"></span><span>Saved on this device</span><button id="local-status" class="tiny-icon" title="Local-only workspace" aria-label="Local-only workspace">ⓘ</button></div>
        </aside>

        <section class="canvas-workspace" aria-label="Design canvas">
          <div class="canvas-topline"><div class="breadcrumbs"><button class="mobile-panel-toggle" id="mobile-layers">Layers</button><span id="active-page-name">Page 1</span><span class="crumb-sep">/</span><strong id="selection-label">Landing page</strong></div><div class="canvas-actions"><button class="mobile-panel-toggle" id="mobile-inspector">Design</button><button class="canvas-action" id="outline-toggle" title="Toggle outlines">◫ <span>Outlines</span></button><button class="canvas-action" id="ruler-toggle" title="Toggle rulers">▤ <span>Rulers</span></button><span class="canvas-divider"></span><button class="canvas-action" id="zoom-out" aria-label="Zoom out">−</button><button class="zoom-value" id="zoom-value">50%</button><button class="canvas-action" id="zoom-in" aria-label="Zoom in">＋</button><button class="canvas-action fit-button" id="fit-canvas" title="Zoom to fit">⛶</button></div></div>
          <div class="canvas-stage" id="canvas-stage">
            <canvas id="design-canvas" aria-label="Interactive design canvas" tabindex="0"></canvas>
            <div class="stage-coordinates" id="stage-coordinates">X 0&nbsp;&nbsp; Y 0</div>
            <div class="job-bar" id="job-bar" hidden>
              <div class="job-main"><div class="job-title"><span class="job-spark">✦</span><strong id="job-title">Applying recipe</strong><span id="job-status">Preparing images…</span></div><progress id="job-progress" max="1" value="0"></progress><span id="job-metrics">0 of 0 · 0 images/s</span></div>
              <label class="job-speed">Speed<select id="job-speed"><option value="auto">Auto</option><option value="fast">Max speed</option><option value="low">Low resource</option></select></label>
              <button class="job-control" id="job-pause">Pause</button><button class="job-control stop" id="job-stop">Stop</button>
            </div>
            <div class="floating-toolbar" id="floating-toolbar" role="toolbar" aria-label="Design tools">
              <button class="tool active" data-tool="select" aria-label="Move and select" title="Move · V"><svg viewBox="0 0 24 24"><path d="m5 3 14 11-7 1-3 6z"/></svg><span class="tool-tip">Move</span></button>
              <span class="tool-separator"></span>
              <button class="tool" data-tool="frame" aria-label="Frame tool" title="Frame · F"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8v8H8z"/></svg></button>
              <button class="tool" data-tool="rectangle" aria-label="Rectangle tool" title="Rectangle · R"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
              <button class="tool" data-tool="ellipse" aria-label="Ellipse tool" title="Ellipse · O"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
              <button class="tool" data-tool="pen" aria-label="Pen tool" title="Pen · P — click points, drag for curves, Escape to finish, click the first point to close"><svg viewBox="0 0 24 24"><path d="m18 3 3 3L7 20l-4 1 1-4z"/><path d="m15 6 3 3M4 17l3 3"/></svg></button>
              <button class="tool" data-tool="text" aria-label="Text tool" title="Text · T"><svg viewBox="0 0 24 24"><path d="M4 6h16M12 6v13m-4 0h8"/></svg></button>
              <button class="tool" data-tool="image" aria-label="Place image" title="Place image · ⇧⌘K"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17 5-4 3 2 3-4 3 6"/></svg></button>
              <span class="tool-separator"></span>
              <button class="tool" data-tool="hand" aria-label="Hand tool" title="Hand · H"><svg viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v5c0 4-2 7-6 7h-2c-2 0-3-1-4-3l-2-3a1.6 1.6 0 0 1 2-2z"/></svg></button>
              <button class="tool" data-tool="comment" aria-label="Comment tool" title="Comments are available in a future collaboration update"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9 9 0 0 1-4-.9L4 20l1.3-3.3A7 7 0 0 1 4 12c0-4 3.6-7 8-7s8 2.5 8 6.5z"/></svg></button>
            </div>
          </div>
          <footer class="canvas-footer"><div class="footer-left"><span class="canvas-dot"></span><span id="canvas-message">All changes stay on this device</span></div><div class="footer-right"><span id="cursor-position">X —&nbsp;&nbsp; Y —</span><span class="footer-divider"></span><span id="selection-size">No selection</span></div></footer>
        </section>

        <aside class="right-panel" aria-label="Design properties">
          <div class="inspector-tabs"><button class="inspector-tab active" data-inspector-tab="design">Design</button><button class="inspector-tab" data-inspector-tab="prototype" title="Set local prototype interactions">Prototype</button><button class="tiny-icon inspect-more" aria-label="Inspector menu">···</button></div>
          <section class="inspector-scroll" id="inspector-content"></section>
          <div class="inspector-bottom"><button id="add-export-setting">＋ Add export setting</button></div>
        </aside>
      </div>

      <input id="image-input" type="file" accept="image/*" multiple hidden />
      <input id="project-input" type="file" accept="application/json,.tstar" hidden />
      <div class="context-menu" id="context-menu" role="menu" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="mobile-backdrop" id="mobile-backdrop" hidden></div>
      <dialog id="recipe-dialog" class="recipe-dialog"><form method="dialog" id="recipe-form"><header><strong>Save image recipe</strong><button value="cancel" aria-label="Close">×</button></header><p id="recipe-source-name">Save the current image adjustments for reuse.</p><label>Recipe name<input id="recipe-name-input" maxlength="48" required value="My image look" /></label><footer><button class="dialog-cancel" value="cancel">Cancel</button><button class="dialog-save" id="recipe-save-button" value="save">Save recipe</button></footer></form></dialog>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
