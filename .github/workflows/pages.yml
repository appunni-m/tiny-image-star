name: Verify and deploy Tiny Image Star

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiny-image-star-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the active editor
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run model, storage, and WASM tests
        run: node scripts/ci-test.mjs

      - name: Verify static deployment inputs
        run: npm run verify:static

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the active editor
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble the Tiny Image Star artifact
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R src wasm _site/

      - name: Upload only the active editor
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
